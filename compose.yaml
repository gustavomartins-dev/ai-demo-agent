services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_demo_agent
      POSTGRES_USER: ai_demo_agent
      POSTGRES_PASSWORD: ai_demo_agent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_demo_agent -d ai_demo_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ai_demo_agent_postgres:/var/lib/postgresql/data

volumes:
  ai_demo_agent_postgres:
